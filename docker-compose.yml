services:
  squadslot:
    build: .
    container_name: squadslot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_PATH: /data/squadslot.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in a .env file before starting SquadSlot}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_NAME: ${DISCORD_BOT_NAME:-SquadSlot}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - squadslot-data:/data

volumes:
  squadslot-data:
