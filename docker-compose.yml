services:
  squadslot:
    build: .
    container_name: squadslot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_PATH: /data/squadslot.db
      TZ: ${TZ:-Europe/London}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in a .env file before starting SquadSlot}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_NAME: ${DISCORD_BOT_NAME:-SquadSlot}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - squadslot-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  squadslot-data:
